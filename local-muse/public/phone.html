<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair with Muse</title><link rel="stylesheet" href="/style.css"><script src="/phone.js" defer></script></head>
<body><main class="pairing-page"><span class="eyebrow">MUSE · PRIVATE PHONE ACCESS</span><h1>Your ideas, wherever you are.</h1><p>Enter the code shown in Library tools → Mobile access on your home PC. Keep Tailscale connected on your phone.</p><form id="pairForm"><label for="code">One-time pairing code</label><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" required placeholder="10-character code"><button class="primary" type="submit" id="pairButton">Connect to Muse</button></form><p id="pairStatus" role="status" aria-live="polite"></p><p>Your PC must be awake with Muse open. Pairing lasts up to 12 hours, or until mobile access is disabled on the PC.</p></main></body></html>
